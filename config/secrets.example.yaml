# ============================================================================
# 密钥文件（示例）—— 复制成 secrets.yaml 后填入真实值
# ----------------------------------------------------------------------------
# 这是**手写**的那一份。不想编辑 YAML 的话，运行 `media_router.py web`
# 用网页配置，密钥会写到 config/secrets.web.yaml（同样在 .gitignore 里）。
# 两份文件是叠加关系：本文件先读，secrets.web.yaml 后读、覆盖同名键。
#
# 取密钥的优先级（从高到低）：
#   1. 环境变量：models.yaml 里 api_key_env 指定的那个变量名
#   2. 本文件 keys.<环境变量名>
#   3. config/secrets.web.yaml keys.<环境变量名>（网页配置写的）
#   4. 两份文件里的 keys.<模型 id>
#   5. models.yaml 条目里的 api_key 内联字段（不推荐，会被提交进版本库）
#
# 强烈建议用环境变量；把密钥写进文件时，务必确认 secrets.yaml / secrets.web.yaml
# 都已在 .gitignore 里（默认就是）。
# ============================================================================

keys:
  # 火山方舟（即梦 / Seedance）
  ARK_API_KEY: ""

  # 阿里云百炼（通义万相）
  DASHSCOPE_API_KEY: ""

  # 可灵需要一对密钥，用 "AK:SK" 的冒号形式写在一个变量里
  # 也可以用 options.access_key_env / options.secret_key_env 分开指定
  KLING_KEYS: ""

  # OpenAI / 或任何 OpenAI 兼容网关
  OPENAI_API_KEY: ""
  SILICONFLOW_API_KEY: ""

  # 万能模板用
  MY_API_KEY: ""

  # 按模型 id 覆盖（优先级低于上面的环境变量名）
  # wanx-2.5: ""
