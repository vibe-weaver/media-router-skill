# ============================================================================
# media-router 模型池配置
# ----------------------------------------------------------------------------
# 这是你唯一需要长期维护的文件。改完直接生效，不用重启任何东西。
#
# 每个池默认只带一条内置兜底（builtin-imagen / builtin-video）；把你自己的模型加到
# models: 下面即可，改完直接生效。也可以运行 `media_router.py web` 在网页上添加。
# 想看各平台的完整写法见 references/providers.md。
#
# 三个核心字段的语义：
#   priority  优先级档位，数值越小越优先。priority=1 的模型永远压过 priority=2。
#   weight    同一 priority 档位内的权重，决定"被抽中的概率"。
#             权重 50 和 30 在同一档里，就是 50/80 与 30/80 的出手比例。
#   supports  能力标签，路由时按需过滤。
#             图片: text2img / img2img
#             视频: text2video / img2video
#             语音: text2audio / audio2audio
#   input_modalities / output_modalities
#             功能标签：这个模型能接受什么、能产出什么（text/image/video/audio）。
#             只用于标注功能、让 agent 挑模型时看得清，不参与路由过滤。
#             图片模型可选 text/image，视频模型四种都行，语音模型是 text/audio；
#             不写就按类目推默认值。
#             在配置页面添加模型时，勾「输入模态 / 输出模态」就是在填这两个字段。
#
# 类目（页面上就是三个页签）：image 图像 / video 视频 / audio 语音。
# 三个类目是写死的：页面、写入校验、CLI 的 --kind 都按这三个来。
#
# strategy 只剩一种：priority_then_weight —— 先按 priority 分档，
# 只在最小那一档里按 weight 加权随机，更高档（数字更大）全部是备用。
# （weight_only / fallback_chain 已下线；老配置里写着它们会告警并按这套处理。）
#
# ⚠️ YAML 的引号规则（踩过坑，一定要看）：
#   下面这几类值**必须加引号**，否则读出来的东西不是你想的那个：
#     * 占位符：   "{{prompt}}"      —— 裸写会被当成行内映射
#     * 比值/时间： "16:9" "1:1" "12:30"
#       裸写的 1:1 会被 YAML 当成**六十进制整数 61**（这是 YAML 1.1 的规定），
#       等于把 61 发给接口。这条最阴，因为它不报错，只是悄悄变错。
#     * 日期：     "2026-01-01"      —— 裸写会被读成 date 对象
#     * 带「冒号+空格」的文本： "重要: 别删"
#   拿不准就一律加引号，加了永远没错。
#   程序会在加载时做一次原文体检，发现问题会出现在 config / list 命令的
#   warnings 里，网页配置页顶部也会提示。
# ============================================================================

version: 1

defaults:
  # 单次 HTTP 请求超时（秒）
  timeout_seconds: 120
  # 异步任务的轮询间隔（秒）
  poll_interval_seconds: 5
  # 异步任务最长等待（秒），超时即判定该模型失败并降级
  max_poll_seconds: 900
  # 单次 generate 最多尝试几个候选模型（失败后自动换下一个）
  max_attempts: 2
  # 产物落盘目录。null = ./outputs（运行命令时的当前工作目录）
  # 实际写入 <该目录>/image 或 <该目录>/video（按类目分子目录）
  output_dir: null
  # 熔断状态目录。null = <skill>/state
  state_dir: null

  # 熔断策略：某模型连续失败 failure_threshold 次后，进入 cooldown_seconds 冷却
  health:
    failure_threshold: 3
    cooldown_seconds: 300

  # 结果回传时的文字描述（让纯文本模型也能"读懂"产物）
  #   mode: off       不回描述，只给元数据
  #         metadata  只给结构化元数据（宽高/时长/大小），零成本
  #         vlm       额外调用视觉模型产出一句话描述 ← 推荐，能真正接住任务
  caption:
    mode: metadata
    # mode 改成 vlm 时这里必填：写清视觉模型的地址。
    # 不设兜底地址，是为了避免"密钥配的是别家、请求却发到默认厂商"。
    endpoint: ""
    model: ""
    api_key_env: OPENAI_API_KEY
    prompt: "用一两句中文客观描述这张图片：主体内容、风格、构图与配色。"

# ---------------------------------------------------------------------------
# 图片模型池 —— 默认只有一条内置工具兜底，往 models: 下面加自己的条目即可
# ---------------------------------------------------------------------------
image:
  strategy: priority_then_weight
  models:
    # 内置工具兜底：不调任何接口，把请求交回给 AI 助手，让它用自己的 ImageGen 完成。
    # 它没有「输入/输出模态」—— 真正干活的是 agent 的工具，标了反而像真模型。
    # priority 给一个很大的数（1000000），保证它永远排在真模型后面；没配 Key 时靠它兜底，
    # 任务不会直接失败（返回 status: delegate，退出码 3）。自己加的模型会自动排在它前面。
    # 配置页面把它标为「内置」，不允许编辑/删除，只能隐藏。
    - id: builtin-imagen
      provider: native
      priority: 1000000
      weight: 100
      enabled: true
      supports: [text2img, img2img]
# 示例（完整写法见 references/providers.md）：
# image:
#   strategy: priority_then_weight
#   models:
#     - id: my-image-model            # 唯一 id，自己起
#       provider: openai              # 适配器类型（openai/dashscope/volcengine/…）
#       model: cogview-4              # 平台里的模型名
#       priority: 1
#       weight: 50
#       enabled: true
#       supports: [text2img]          # 需要图生图再加 img2img
#       input_modalities: [text]      # 功能标签：能接受「文本」
#       output_modalities: [image]    # 功能标签：能产出「图片」
#       api_key_env: ZHIPU_API_KEY    # 密钥从哪个环境变量/密钥文件读
#       # endpoint: https://…         # 可选，非默认网关才需要
#       # params:
#       #   size: 1024x1024

# ---------------------------------------------------------------------------
# 视频模型池 —— 默认只有一条内置工具兜底，同样往 models: 下面加自己的条目
# ---------------------------------------------------------------------------
video:
  strategy: priority_then_weight
  models:
    # 同图片池的内置工具兜底，委托给 agent 的 VideoGen。同样只可隐藏、不可编辑。
    - id: builtin-video
      provider: native
      priority: 1000000
      weight: 100
      enabled: true
      supports: [text2video, img2video]
# 示例：
# video:
#   strategy: priority_then_weight
#   models:
#     - id: my-video-model
#       provider: volcengine
#       model: doubao-seedance-1-0-pro-250528
#       priority: 1
#       weight: 60
#       enabled: true
#       supports: [text2video, img2video]
#       input_modalities: [text, image]   # 能接受「文本」「图片」
#       output_modalities: [video]        # 能产出「视频」（也可加 audio/text/image）
#       api_key_env: ARK_API_KEY
#       params:
#         ratio: "16:9"               # ⚠️ 比值必须加引号（见顶部说明）
#         duration: 5

# ---------------------------------------------------------------------------
# 语音模型池（语音合成 TTS）—— 默认空池，往 models: 下面加条目即可。
# 页面「模型配置 → 语音模型」页签对应的就是这一节。
#
# 已支持的生成通路：
#   provider: dashscope —— 同步。qwen-audio-*-tts-* / cosyvoice-*
#                           端点 /services/audio/tts/SpeechSynthesizer，入参用 text_prompt
#                          qwen3-tts-*
#                           端点 /services/aigc/multimodal-generation/generation，入参用 text
#   provider: openai    —— 同步。/v1/audio/speech，直接回音频二进制
#                          智谱 BigModel（glm-tts）和硅基流动（CosyVoice2-0.5B 等）
#                          都是这套协议，填对应厂商的地址即可。默认音色/格式按域名取：
#                          智谱 tongtong + wav（它只收 wav/pcm，mp3 会 400），
#                          硅基 <模型名>:alex + mp3，其余 alloy + mp3。
#                          显式写 params.voice / params.response_format 永远优先。
#   provider: kling     —— **异步**。/audio/tts 提交，轮询 /audio/tts/{task_id}；
#                          请求体没有 model_name，音色用 params.voice_id 指定（**必填**，
#                          如 chuanmeizi_speech02），voice_language 不填默认 zh。
#                          鉴权：新版控制台的单个 API Key（api-key-kling-…）直接当 Bearer；
#                          旧版 AccessKey:SecretKey 也支持。语音和视频共用同一把 Key。
#   provider: volcengine —— 同步流式。**注意域名不同**：语音在豆包语音
#                          (openspeech.bytedance.com/api/v3/tts/unidirectional)，
#                          不在方舟下面；鉴权是新版 X-Api-Key（或旧版 appid:token）
#                          + X-Api-Resource-Id（默认 seed-tts-2.0）；
#                          音色用 params.speaker 指定（**必填**），返回是 base64 音频片段流。
#                          语音的 Key 与方舟的 ARK_API_KEY 不通用，建议单独加一个厂商条目。
# 其余平台（replicate、fal）的 TTS 协议各不相同，暂未接入；
# 配了会明确报「该类目还没有接入适配器」，不会静默拿图像接口去打。
#
# voice / format / sample_rate 都可以不填（平台有默认值），要固定音色就写进 params。
# 注意：qwen-audio 系列调语速/情感用的是 instruction（自然语言指令），不是 speed ——
# 实测传 speed=1.2 仍返回 200，但时长没变，多半是被平台忽略了。
# ---------------------------------------------------------------------------
audio:
  strategy: priority_then_weight
  models: []
# 示例：
# audio:
#   strategy: priority_then_weight
#   models:
#     - id: my-tts
#       provider: openai              # 或 generic_http 接任意 REST 接口
#       model: tts-1                  # 平台侧的模型名
#       priority: 1
#       weight: 50
#       enabled: true
#       supports: [text2audio]        # 语音克隆再加 audio2audio
#       input_modalities: [text]      # TTS：文本进
#       output_modalities: [audio]    # 音频出（ASR 模型反过来写 text）
#       api_key_env: OPENAI_API_KEY
#       params:
#         voice: alloy                # 音色
#         speed: 1.0                  # 语速
